# Task Contract: APP-2
name: "APP-2"
title: "Blog running with Sanity"
epic: "personal-blog"
milestone: 2

description: >
  Connect the blog to a real Sanity project. The home page reads posts from
  Sanity. The Studio loads and shows the content schema. Draft mode works.

done_when:
